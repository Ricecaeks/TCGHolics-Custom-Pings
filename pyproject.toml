[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcgpings"
version = "0.1.0"
description = "Multi-node NZ TCG stock monitor that posts store-level alerts to Discord"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29",
    "curl_cffi>=0.7",
    "discord.py>=2.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
tcgpings = "tcgpings.__main__:main"

[tool.setuptools.packages.find]
include = ["tcgpings*"]

[tool.setuptools.package-data]
"tcgpings.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
