# Everything on one Windows/Linux machine with Docker Desktop: Postgres + one monitor node.
# Capped so it never gets in the way of games on the same PC.
#   docker compose -f deploy/docker-compose.local.yml up -d --build
# Switch to Supabase later by setting DATABASE_URL in .env and dropping the db service.
name: tcgpings-local

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcgpings
      POSTGRES_PASSWORD: tcgpings
      POSTGRES_DB: tcgpings
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcgpings"]
      interval: 5s
      retries: 20
    cpus: 0.5
    mem_limit: 256m

  node:
    image: tcgpings:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # Paths can point outside the checkout (the deploy workflow does this so a fresh checkout
    # never wipes backups or browser profiles).
    env_file: ${TCGPINGS_ENV:-../.env}
    environment:
      DATABASE_URL: postgresql://tcgpings:tcgpings@db:5432/tcgpings
      NODE_NAME: ${NODE_NAME:-local-pc}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${TCGPINGS_DATA:-../data}:/app/data
    stop_grace_period: 30s
    shm_size: 512m      # Chrome needs more than Docker's 64 MB default
    cpus: 2.0           # hard cap: 2 of your 16 threads
    mem_limit: 2g       # Chrome + Python; the node is killed and restarted rather than swapping
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  pgdata:
