# The production stack on the NUC (Linux, i5-5250U, 2 cores / 4 threads, 16 GB): Postgres plus a small fleet
# of bot containers, all from one image, sharing .env and data/ (each writes its own data/logs/bot-<node>.log):
#   control         leads (Discord bot, planner, health posts, backups) and sends alerts; claims no jobs
#   worker-http     the plain-HTTP stores (Shopify, JB Hi-Fi, ...): many quick jobs at once
#   worker-browser  the stores behind Chrome or the paid unblockers (Farmers, Kmart, Warehouse, ...): a few slow jobs
# Every container also sends alerts (the outbox is leased, so nothing is sent twice). See tcgpings/cluster/lanes.py.
# The deploy workflow runs it from the runner's checkout with .env and data/ in TCGPINGS_HOME (/opt/tcgpings):
#   TCGPINGS_ENV=/opt/tcgpings/.env TCGPINGS_DATA=/opt/tcgpings/data \
#     docker compose -f deploy/docker-compose.nuc.yml -p tcgpings up -d --build --remove-orphans
#
# More HTTP workers: set worker-http's NODE_NAME to "" (each copy then names itself after its container's
# hostname; node names must be unique) and add `--scale worker-http=2` to the command above. Each copy
# opens up to DB_POOL_SIZE database connections; stay well under max_connections below.
name: tcgpings

x-node: &node
  image: tcgpings:local
  restart: unless-stopped
  env_file: ${TCGPINGS_ENV:-../.env}
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - ${TCGPINGS_DATA:-../data}:/app/data
  stop_grace_period: 30s
  logging: &logging
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-node-env: &node-env
  DATABASE_URL: postgresql://tcgpings:tcgpings@db:5432/tcgpings

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcgpings
      POSTGRES_PASSWORD: tcgpings
      POSTGRES_DB: tcgpings
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Connections: control 4 + 1 for leader election + 1 for backups, worker-http 10, worker-browser 6.
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "effective_cache_size=4GB",
              "-c", "work_mem=8MB", "-c", "max_connections=100"]
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcgpings"]
      interval: 5s
      retries: 20
    mem_limit: 2g
    logging: *logging

  control:
    <<: *node
    build:              # the one service that builds; the workers run the image it makes
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      <<: *node-env
      NODE_NAME: nuc-control
      WORKER_LANES: ""          # claims no jobs
      LEADER_ELIGIBLE: "true"
      BROWSER_HEADLESS: "true"  # never starts Chrome; also skips Xvfb and leaves the browser worker's profile alone
      DB_POOL_SIZE: "4"
    mem_limit: 1g

  worker-http:
    <<: *node
    pull_policy: never  # built by control above
    environment:
      <<: *node-env
      NODE_NAME: nuc-http
      WORKER_LANES: http
      WORKER_CONCURRENCY: "32"
      LEADER_ELIGIBLE: "false"
      BROWSER_HEADLESS: "true"  # no Chrome in this lane, so no virtual display either
      DB_POOL_SIZE: "10"        # 32 jobs at once each write their results; 4 connections would queue them
    mem_limit: 1536m

  worker-browser:
    <<: *node
    pull_policy: never  # built by control above
    environment:
      <<: *node-env
      NODE_NAME: nuc-browser
      WORKER_LANES: browser
      WORKER_CONCURRENCY: "6"   # the Warehouse and every other store stay capped at MAX_INFLIGHT_PER_RETAILER (3)
      LEADER_ELIGIBLE: "false"
      DB_POOL_SIZE: "6"
    shm_size: 1g        # Chrome needs more than Docker's 64 MB default
    mem_limit: 3g

volumes:
  pgdata:
