<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TCGHolics Custom Pings">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1B5E"/>
      <stop offset="1" stop-color="#0E1230"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="0.5" stop-color="#FF9F5A"/>
      <stop offset="1" stop-color="#F0568C"/>
    </linearGradient>
    <linearGradient id="back1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6F5BFF"/>
      <stop offset="1" stop-color="#3B2BB8"/>
    </linearGradient>
    <linearGradient id="back2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FD5E8"/>
      <stop offset="1" stop-color="#1579C9"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Signal rings: the "ping" -->
  <g fill="none" stroke="#2FD5E8" stroke-linecap="round">
    <path d="M338 96 A 92 92 0 0 1 416 174" stroke-width="20" opacity="0.95"/>
    <path d="M340 44 A 146 146 0 0 1 468 172" stroke-width="20" opacity="0.5"/>
  </g>

  <!-- Fanned cards -->
  <g transform="rotate(-20 216 300)">
    <rect x="124" y="166" width="184" height="258" rx="22" fill="url(#back1)"/>
  </g>
  <g transform="rotate(-6 236 296)">
    <rect x="144" y="160" width="184" height="258" rx="22" fill="url(#back2)"/>
  </g>
  <g transform="rotate(9 262 292)">
    <rect x="170" y="154" width="184" height="258" rx="22" fill="url(#foil)"/>
    <rect x="186" y="170" width="152" height="226" rx="12" fill="none" stroke="#0E1230" stroke-opacity="0.28" stroke-width="5"/>
    <!-- Bell -->
    <g fill="#0E1230">
      <path d="M262 214 c-34 0 -52 26 -52 60 v30 l-18 24 h140 l-18 -24 v-30 c0 -34 -18 -60 -52 -60 z"/>
      <circle cx="262" cy="208" r="11"/>
      <path d="M238 340 a24 24 0 0 0 48 0 z"/>
    </g>
  </g>
</svg>
