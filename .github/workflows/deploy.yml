# Continuous deploy to the always-on machine through a GitHub self-hosted runner.
# That machine (the NUC, Linux) runs a runner for this repo with the label "tcgpings-nuc" (see docs/HOSTING.md).
# The runner's working copy is separate from any repo you edit by hand; .env and data/ live in TCGPINGS_HOME.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, tcgpings-nuc]
    defaults:
      run:
        shell: bash
    env:
      # Folder on the runner machine holding .env and data/, outside the checkout so it
      # survives deploys. Set it as a repository variable: /opt/tcgpings.
      TCGPINGS_HOME: ${{ vars.TCGPINGS_HOME }}
      TCGPINGS_ENV: ${{ vars.TCGPINGS_HOME }}/.env
      TCGPINGS_DATA: ${{ vars.TCGPINGS_HOME }}/data
      COMPOSE: docker compose -f deploy/docker-compose.nuc.yml -p tcgpings
    steps:
      - uses: actions/checkout@v4
      - name: Check persistent config
        run: |
          test -n "$TCGPINGS_HOME" || { echo "Set the TCGPINGS_HOME repository variable"; exit 1; }
          test -f "$TCGPINGS_ENV" || { echo "Missing $TCGPINGS_ENV"; exit 1; }
          mkdir -p "$TCGPINGS_DATA"
      - name: Copy secrets into .env
        env:
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
          SCRAPFLY_API_KEY_KMART: ${{ secrets.SCRAPFLY_API_KEY_KMART }}
          SCRAPFLY_API_KEY_FARMERS: ${{ secrets.SCRAPFLY_API_KEY_FARMERS }}
          SCRAPFLY_API_KEY_WAREHOUSE: ${{ secrets.SCRAPFLY_API_KEY_WAREHOUSE }}
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.TEST_CHANNEL_WEBHOOK }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          STAFF_ROLE_ID: ${{ secrets.STAFF_ROLE_ID }}
          MEMBERS_ROLE_ID: ${{ secrets.MEMBERS_ROLE_ID }}
          LOG_CHANNEL_ID: ${{ secrets.LOG_CHANNEL_ID }}
        run: |
          # A secret that isn't set leaves any value already in .env alone.
          [ -z "$(tail -c1 "$TCGPINGS_ENV")" ] || echo >> "$TCGPINGS_ENV"
          for name in SCRAPFLY_API_KEY SCRAPFLY_API_KEY_KMART SCRAPFLY_API_KEY_FARMERS SCRAPFLY_API_KEY_WAREHOUSE ZYTE_API_KEY ALERT_WEBHOOK_URL DISCORD_TOKEN GUILD_ID STAFF_ROLE_ID MEMBERS_ROLE_ID LOG_CHANNEL_ID; do
            value="${!name}"
            [ -n "$value" ] || continue
            sed -i "/^$name=/d" "$TCGPINGS_ENV"
            printf '%s=%s\n' "$name" "$value" >> "$TCGPINGS_ENV"
          done
          chmod 600 "$TCGPINGS_ENV"
      - name: Build and restart
        run: |
          $COMPOSE build
          $COMPOSE up -d --remove-orphans
      - name: Wait for healthy
        run: |
          # Every service that has a healthcheck must report healthy.
          for i in $(seq 1 36); do
            bad=$($COMPOSE ps --format '{{.Name}} {{.Health}}' | awk '$2 != "" && $2 != "healthy"')
            [ -z "$bad" ] && { $COMPOSE ps; exit 0; }
            sleep 5
          done
          echo "Not healthy: $bad"
          $COMPOSE logs --tail 100
          exit 1
      - name: Remove old images
        run: docker image prune -f > /dev/null
