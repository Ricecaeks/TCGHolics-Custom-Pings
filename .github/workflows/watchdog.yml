# Posts to Discord when the bot's machine stops sending heartbeats, and again when it's back.
# An open "Bot offline" issue records the outage, so each one alerts once.
name: watchdog

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      max_age_minutes:
        description: Heartbeat age that counts as offline (0 tests the alert)
        default: "60"

permissions:
  actions: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BOT_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      CHANNEL_ID: ${{ secrets.LOG_CHANNEL_ID }}
      PING_USER_ID: ${{ vars.OFFLINE_PING_USER_ID }}
      MAX_AGE_MINUTES: ${{ inputs.max_age_minutes || '60' }}
    steps:
      - name: Compare the last heartbeat with the open outage
        run: |
          # Posts as the bot, so this works with the machine off, and tags the owner so the phone gets a push.
          post() {
            jq -n --arg content "<@$PING_USER_ID> $1" --arg user "$PING_USER_ID" \
              '{content: $content, allowed_mentions: {users: [$user]}}' |
              curl -fsS -A 'DiscordBot (https://github.com/Ricecaeks, 1)' -H "Authorization: Bot $BOT_TOKEN" \
                -H 'Content-Type: application/json' -d @- "https://discord.com/api/v10/channels/$CHANNEL_ID/messages" > /dev/null
          }
          last=$(gh run list --workflow heartbeat.yml --status success --limit 1 --json createdAt -q '.[0].createdAt')
          if [ -z "$last" ]; then echo "No heartbeat yet"; exit 0; fi
          age=$(( ($(date +%s) - $(date -d "$last" +%s)) / 60 ))
          echo "Last heartbeat $age minutes ago"
          issue=$(gh issue list --state open --search 'in:title "Bot offline"' --json number -q '.[0].number')
          if [ "$age" -ge "$MAX_AGE_MINUTES" ] && [ -z "$issue" ]; then
            # Post first: if Discord fails, no issue is open and the next run tries again.
            post ":warning: **Stock alerts are offline.** No healthy heartbeat from the NUC for $age minutes, so drops may be missed."
            gh issue create --title "Bot offline" --body "No healthy heartbeat since $last."
          elif [ "$age" -lt "$MAX_AGE_MINUTES" ] && [ -n "$issue" ]; then
            post ":white_check_mark: **Stock alerts are back online.** Anything that changed during the outage alerts on the next check."
            gh issue close "$issue" --comment "Heartbeats are back."
          fi
