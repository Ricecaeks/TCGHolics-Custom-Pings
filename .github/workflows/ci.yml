name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tcgpings
          POSTGRES_PASSWORD: tcgpings
          POSTGRES_DB: tcgpings
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tcgpings"
          --health-interval 2s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://tcgpings:tcgpings@localhost:5432/tcgpings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/ricecaeks/tcgholics-custom-pings:latest
            ghcr.io/ricecaeks/tcgholics-custom-pings:${{ github.sha }}
