# Runs on the bot's own machine (the NUC), so a success proves the machine is awake, the bot healthy,
# and that it's actually working: some job succeeded and no alert sat unsent in the last 15 minutes,
# and no job has waited over 20 minutes for a worker.
# A failed run emails the owner; watchdog.yml runs on GitHub's side and raises the alarm in
# Discord when these successes stop.
name: heartbeat

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency: heartbeat

permissions: {}

jobs:
  beat:
    runs-on: [self-hosted, tcgpings-nuc]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the bot is healthy
        run: |
          # Every container of the stack that has a healthcheck must be healthy, and there must be some.
          out=$(docker ps -a --filter label=com.docker.compose.project=tcgpings --format '{{.Names}} {{.State}} {{.Status}}')
          echo "$out"
          [ -n "$out" ] || { echo "::error::The tcgpings stack isn't running"; exit 1; }
          if echo "$out" | grep -v '(healthy)' | grep -q .; then
            echo "::error::A container isn't running or isn't healthy"; exit 1
          fi
      - name: Check jobs and alerts ran recently
        run: |
          # Read-only. Alerts that gave up after 8 tries (attempts >= 8) are left out: the leader
          # already posts about those in the log channel, and they'd fail every beat until purged.
          sql="SELECT coalesce(floor(extract(epoch FROM now() - max(last_ok_at)) / 60)::int, -1),
            (SELECT count(*) FROM alert_outbox WHERE sent_at IS NULL AND attempts < 8 AND created_at < now() - make_interval(mins => 15)),
            (SELECT count(*) FROM alert_outbox WHERE sent_at IS NULL AND attempts >= 8) FROM jobs"
          out=$(docker exec tcgpings-db-1 psql -U tcgpings -d tcgpings -tAX -v ON_ERROR_STOP=1 -c "$sql") \
            || { echo "::error::database query failed"; exit 1; }
          IFS='|' read -r job_age stuck dead <<< "$out"
          echo "last successful job: $job_age min ago; alerts unsent over 15 min: $stuck; given up: $dead"
          failed=0
          if [ "$job_age" -lt 0 ] || [ "$job_age" -ge 15 ]; then echo "::error::No job has succeeded in the last 15 minutes"; failed=1; fi
          if [ "$stuck" -gt 0 ]; then echo "::error::$stuck alert(s) unsent for over 15 minutes"; failed=1; fi
          exit $failed
      - name: Check the job queue keeps up
        run: |
          # Read-only. Due jobs waiting for a worker (enabled, unpaused, at an enabled retailer, not running).
          # Fails when jobs at 2 or more stores are over 20 minutes late: the workers as a whole aren't
          # keeping up. One slow store on its own (e.g. a site that makes every check slow) is reported by
          # the leader in the log channel and /status instead, so it can't raise a false "offline" alarm.
          sql="SELECT count(*) FILTER (WHERE j.next_run_at < now() - make_interval(mins => 20)),
            count(DISTINCT j.retailer_id) FILTER (WHERE j.next_run_at < now() - make_interval(mins => 20)),
            coalesce(floor(extract(epoch FROM now() - min(j.next_run_at)) / 60)::int, 0),
            coalesce(string_agg(DISTINCT j.retailer_id, ', ') FILTER (WHERE j.next_run_at < now() - make_interval(mins => 20)), '')
            FROM jobs j JOIN retailers r ON r.id = j.retailer_id
            WHERE j.enabled AND r.enabled AND j.paused_at IS NULL AND j.next_run_at <= now()
              AND (j.lease_until IS NULL OR j.lease_until < now())"
          out=$(docker exec tcgpings-db-1 psql -U tcgpings -d tcgpings -tAX -v ON_ERROR_STOP=1 -c "$sql")             || { echo "::error::database query failed"; exit 1; }
          IFS='|' read -r late stores worst names <<< "$out"
          echo "jobs over 20 min late: $late at $stores store(s) ${names:+($names)}; oldest waiting: $worst min"
          if [ "$stores" -ge 2 ]; then echo "::error::$late job(s) at $stores stores over 20 minutes overdue (oldest $worst min): $names"; exit 1; fi
          if [ "$late" -gt 0 ]; then echo "::warning::$late job(s) at $names over 20 minutes overdue (oldest $worst min)"; fi
